name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-linux-and-android:
    name: Build Linux (DEB + AppImage) & Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Run unit tests
        run: gradle :composeApp:desktopTest :composeApp:testDebugUnitTest --no-daemon

      - name: Build Linux DEB and distributable
        run: |
          gradle :composeApp:packageDeb :composeApp:createDistributable --no-daemon
          ./composeApp/build/compose/binaries/main/app/Recurra/bin/Recurra --smoke-test

      - name: Package Linux AppImage
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="1.0.0"; fi
          chmod +x packaging/linux/build-appimage.sh
          ./packaging/linux/build-appimage.sh "$VERSION"

      - name: Build Android APK
        run: gradle :composeApp:assembleRelease --no-daemon

      - name: Stage Linux & Android release artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="1.0.0"; fi
          mkdir -p release-artifacts
          cp composeApp/build/compose/binaries/main/deb/*.deb "release-artifacts/recurra-${VERSION}-amd64.deb"
          cp "build/Recurra-${VERSION}-x86_64.AppImage" "release-artifacts/"
          APK=$(find composeApp/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK" "release-artifacts/recurra-${VERSION}-android.apk"
          ls -lh release-artifacts/

      - name: Upload Linux & Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-android-artifacts
          path: release-artifacts/*

  build-windows:
    name: Build Windows (Portable ZIP + MSI)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Run Windows tests
        run: gradle :composeApp:desktopTest --no-daemon

      - name: Build Windows distributable & MSI
        run: |
          gradle :composeApp:createDistributable :composeApp:packageMsi --no-daemon
          .\composeApp\build\compose\binaries\main\app\Recurra\Recurra.exe --smoke-test

      - name: Stage Windows release artifacts
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($ver) -or $ver -eq "main") { $ver = "1.0.0" }
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          Compress-Archive -Path "composeApp/build/compose/binaries/main/app/Recurra/*" -DestinationPath "release-artifacts/Recurra-$ver-windows-x64-portable.zip" -Force
          $msi = Get-ChildItem "composeApp/build/compose/binaries/main/msi/*.msi" | Select-Object -First 1
          Copy-Item $msi.FullName "release-artifacts/Recurra-$ver-windows-x64.msi"
          Get-ChildItem release-artifacts

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: release-artifacts/*

  publish-release:
    name: Publish GitHub Release
    needs: [ build-linux-and-android, build-windows ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd all-artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release create "$TAG" all-artifacts/* \
            --title "Recurra $TAG" \
            --notes-file CHANGELOG.md \
            --latest
